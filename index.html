<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a140c" />
  <title>IGNITE 2026 — No-Code Startup Hackathon | I&E Cell</title>
  <meta
    name="description"
    content="IGNITE 2026 is a 20-week no-code startup hackathon organized by the I&E Cell. It's not a weekend hackathon; it's a startup, built over 20 weeks. Pitch your idea, win from a ₹1,00,000 grant, and get incubated."
  />
  <meta name="keywords" content="IGNITE, IGNITE 2026, No-Code Hackathon, Startup Hackathon, I&E Cell, E-Cell, Startup Incubation, 20 Week Startup, Student Founders, EdTech, FinTech, HealthTech" />
  <link rel="icon" href="/icon.png" sizes="256x256" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-icon.png" sizes="180x180" type="image/png" />
  <meta property="og:title" content="IGNITE 2026 — No-Code Startup Hackathon | I&E Cell" />
  <meta property="og:description" content="It's not a weekend hackathon. It's a startup, built over 20 weeks. Win a ₹1,00,000 grant, founder sessions, and ecosystem visits." />
  <meta property="og:type" content="website" />

  <!-- Security & Privacy Directives -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' https://apply.devfolio.co; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https: wss:; frame-src 'self' https: http://localhost:*; object-src 'none'; base-uri 'self';"
  />
  
  <!-- Critical Asset Preloading (all self-hosted) -->
  <link rel="preload" href="/images/hero/hero_poster_v3.jpg" as="image" fetchpriority="high" />
  <link rel="preload" href="/images/bg/cloud.jpg" as="image" fetchpriority="high" />

  <!-- Synchronous Intro Phase Check before paint -->
  <script>
    (function() {
      try {
        var s = window.location.search;
        var h = window.location.hash;
        var f = s.match(/[?&]intro=([^&]+)/);
        var fv = f ? f[1] : null;
        var ha = (h && h !== '#') || Boolean(sessionStorage.getItem('recursive:skip-intro-for-anchor'));
        var r = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var completed = sessionStorage.getItem('recursive:intro:v1') === '1';

        if (fv !== '0' && !ha && (!r || fv === '1') && !completed) {
          document.documentElement.dataset.intro = 'playing';
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
          window.scrollTo(0, 0);
        } else {
          document.documentElement.dataset.intro = 'done';
        }
      } catch (e) {
        document.documentElement.dataset.intro = 'done';
      }
    })();
  </script>

  <!-- Devfolio SDK -->
  <script defer src="https://apply.devfolio.co/v2/sdk.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
