  <!-- Synchronous Intro Phase Check before paint -->
  <script>
    (function () {
      try {
        // Clear any old sessionStorage flags that permanently blocked reloads
        sessionStorage.removeItem('recursive:intro:v1');
        sessionStorage.removeItem('recursive:skip-intro-for-anchor');

        var s = window.location.search;
        var f = s.match(/[?&]intro=([^&]+)/);
        var fv = f ? f[1] : null;
        var r = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        var isMobile = window.innerWidth < 768;

        // Skip intro if on mobile, or disabled via ?intro=0, or prefers-reduced-motion without override
        if (fv === '0' || (r && fv !== '1') || (isMobile && fv !== '1')) {
          document.documentElement.dataset.intro = 'done';
        } else {
          document.documentElement.dataset.intro = 'playing';
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
          window.scrollTo(0, 0);
        }
      } catch (e) {
        document.documentElement.dataset.intro = 'playing';
      }
    })();
  </script>
